workflows:
  android-workflow:
    name: Build Android APK
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Recreate Android structure from scratch
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.kashmir.reels
      - name: Get flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

